<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPUタスク割り振りシミュレーター</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #581c87 50%, #1e293b 100%);
            min-height: 100vh;
            padding: 20px; color: white;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { font-size: 2rem; margin-bottom: 6px; }
        .header p { color: #c084fc; }

        .setup-panel, .stats-panel, .queue-panel {
            background: #1e293b;
            border: 2px solid rgba(168,85,247,0.25);
            border-radius: 12px;
            padding: 20px;
        }

        .setup-panel { max-width: 700px; margin: 0 auto 20px; }
        .input-group { margin-bottom: 14px; }
        .input-group label { display:block; margin-bottom:6px; font-weight:bold; }
        .input-group input, .input-group select {
            width:100%; padding:10px; font-size:1rem; background:#334155; border:1px solid rgba(168,85,247,0.25);
            border-radius:6px; color:white;
        }
        .btn { cursor:pointer; border:none; border-radius:8px; padding:10px 14px; font-weight:bold; }
        .btn-start { background: linear-gradient(135deg,#16a34a,#059669); color:white; }
        .btn-reset { background:#dc2626; color:white; }
        .btn-pause { background:#f59e0b; color:white; }
        .btn-home { background:#3b82f6; color:white; }

        .stats-grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:12px; }
        .stat-item label { color:#c084fc; font-size:0.85rem; margin-bottom:6px; display:block; }
        .stat-item .value { font-size:1.4rem; font-weight:bold; }

        .queue-container { display:flex; gap:8px; overflow-x:auto; padding:10px 0; }
        .task-item { background:#fbbf24; color:#1e293b; padding:6px 8px; border-radius:6px; font-weight:bold; font-size:0.8rem; white-space:nowrap; }

        .cores-grid { display:grid; grid-template-columns: repeat(auto-fill,minmax(100px,1fr)); gap:10px; margin-top:12px; }
        .core-item { background:#111827; border-radius:8px; padding:8px; border:1px solid rgba(255,255,255,0.04); transition: box-shadow .2s, border-color .2s; }
        .core-item.active-low { border-color:#10b981; box-shadow: 0 0 8px rgba(16,185,129,0.15); }
        .core-item.active-mid { border-color:#f59e0b; box-shadow: 0 0 8px rgba(245,158,11,0.15); }
        .core-item.active-high { border-color:#ef4444; box-shadow: 0 0 8px rgba(239,68,68,0.15); }
        .core-header { font-weight:bold; margin-bottom:6px; font-size:0.85rem; color:#c7c7c7; }
        .core-task { background:#7c3aed; border-radius:6px; padding:6px; font-size:0.78rem; color:white; }
        .progress-bar { background:#334155; height:6px; border-radius:4px; margin-top:6px; overflow:hidden; }
        .progress-fill { background:#10b981; height:100%; transition: width 0.08s linear; }

        .core-idle { color:#64748b; text-align:center; padding:8px; font-size:0.8rem; }

        .complete-message { background:#16a34a; border-radius:12px; padding:14px; text-align:center; font-weight:bold; color:white; margin-top:12px; }
        .hidden { display:none; }

        /* スマホ表示調整: 横に4列表示する */
        @media (max-width:600px) {
            .header h1 { font-size:1.6rem; }
            /* ここで小さな画面でも常に4カラムにする */
            .cores-grid { grid-template-columns: repeat(4, 1fr); gap:8px; }
            /* 各コアの余白や文字サイズを少し縮めて詰める */
            .core-item { padding:6px; }
            .core-header { font-size:0.75rem; margin-bottom:4px; }
            .core-task { padding:5px; font-size:0.72rem; }
            .progress-bar { height:5px; }
            .task-item { padding:4px 6px; font-size:0.75rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ CPUタスク割り振りシミュレーター</h1>
            <p>パラメータを設定してシミュレーションを開始しよう</p>
        </div>

        <div id="setupScreen" class="setup-panel">
            <h2>シミュレーション設定</h2>

            <div class="input-group">
                <label for="coresInput">🖥️ コア数</label>
                <input id="coresInput" type="number" value="16" min="1" max="10000">
            </div>

            <div class="input-group">
                <label for="clockInput">⚡ クロック速度 (MHz)</label>
                <input id="clockInput" type="number" value="1000" min="100" max="10000" step="100">
            </div>

            <div class="input-group">
                <label for="tasksInput">📋 総タスク数</label>
                <input id="tasksInput" type="number" value="1000" min="1" max="200000" step="1">
            </div>

            <div class="input-group">
                <label for="algoSelect">🔀 スケジューリングアルゴリズム</label>
                <select id="algoSelect">
                    <option value="fcfs">FCFS（先着順）</option>
                    <option value="sjf">SJF（最短ジョブ優先）</option>
                </select>
            </div>

            <div style="display:flex; gap:8px; margin-top:8px;">
                <button id="startBtn" class="btn btn-start">▶️ シミュレーション開始</button>
                <button id="resetBtn" class="btn btn-reset">🔄 リセット</button>
            </div>
        </div>

        <div id="simScreen" class="hidden">
            <div class="stats-panel" aria-live="polite" id="statsPanel">
                <div class="stats-grid">
                    <div class="stat-item">
                        <label>コア数</label><div class="value" id="statCores">0</div>
                    </div>
                    <div class="stat-item">
                        <label>クロック速度</label><div class="value" id="statClock">0 MHz</div>
                    </div>
                    <div class="stat-item">
                        <label>処理済み</label><div class="value" id="statProcessed" style="color:#10b981">0</div>
                    </div>
                    <div class="stat-item">
                        <label>残り（キュー + 実行中）</label><div class="value" id="statRemaining" style="color:#fbbf24">0</div>
                    </div>
                </div>

                <div style="display:flex; gap:8px; align-items:center;">
                    <button id="pauseBtn" class="btn btn-pause">⏸️ 一時停止</button>
                    <button id="homeBtn" class="btn btn-home">🏠 ホームに戻る</button>
                    <div style="flex:1"></div>
                    <div style="font-size:0.85rem; color:#c084fc">アルゴリズム: <span id="statAlgo">FCFS</span></div>
                </div>
            </div>

            <div class="queue-panel" style="margin-top:12px;">
                <h3>📋 タスクキュー (<span id="queueCount">0</span>)</h3>
                <div class="queue-container" id="queueContainer" aria-live="polite"></div>
            </div>

            <div class="cores-grid" id="coresContainer" style="margin-top:12px;"></div>

            <div id="completeMessage" class="complete-message hidden">
                🎉 全タスク完了！処理済み: <span id="finalCount">0</span>
            </div>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        // =========================================================
        // 【最適化1】Min-Heap 実装 - SJF の O(N) 探索を O(log N) に
        // =========================================================
        class MinHeap {
            constructor(compareFn) {
                this._heap = [];
                this._compare = compareFn || ((a, b) => a - b);
            }

            get size() { return this._heap.length; }

            peek() { return this._heap[0] || null; }

            push(val) {
                this._heap.push(val);
                this._siftUp(this._heap.length - 1);
            }

            pop() {
                if (this._heap.length === 0) return null;
                if (this._heap.length === 1) return this._heap.pop();
                const top = this._heap[0];
                this._heap[0] = this._heap.pop();
                this._siftDown(0);
                return top;
            }

            _siftUp(i) {
                const heap = this._heap;
                const compare = this._compare;
                while (i > 0) {
                    const parent = (i - 1) >> 1;
                    if (compare(heap[i], heap[parent]) >= 0) break;
                    [heap[i], heap[parent]] = [heap[parent], heap[i]];
                    i = parent;
                }
            }

            _siftDown(i) {
                const heap = this._heap;
                const compare = this._compare;
                const n = heap.length;
                while (true) {
                    const left = 2 * i + 1;
                    const right = 2 * i + 2;
                    let smallest = i;
                    if (left < n && compare(heap[left], heap[smallest]) < 0) smallest = left;
                    if (right < n && compare(heap[right], heap[smallest]) < 0) smallest = right;
                    if (smallest === i) break;
                    [heap[i], heap[smallest]] = [heap[smallest], heap[i]];
                    i = smallest;
                }
            }
        }

        // =========================================================
        // シミュレーション状態
        // =========================================================
        let isRunning = false;
        let isPaused = false;
        let cores = 16;
        let clockSpeed = 1000;
        let totalTasks = 1000;
        let algorithm = 'fcfs';
        
        // 【最適化2】FCFSキューとSJFヒープを分離
        let fcfsQueue = [];           // FCFS用: 通常の配列（shift/push）
        let sjfHeap = null;           // SJF用: Min-Heap
        
        let coreStates = [];
        let tasksProcessed = 0;
        let taskIdCounter = 0;
        let rafId = null;
        let lastTimestamp = 0;

        // 【最適化3】描画スロットリング用
        let lastRenderTime = 0;
        const RENDER_INTERVAL = 33; // 約30fps (1000/30 ≈ 33ms)
        
        // 【最適化4】キュー表示の差分更新用フラグ
        let queueDirty = true;
        const MAX_QUEUE_DISPLAY = 40;
        
        // 【最適化5】前回の統計値をキャッシュして変更時のみ更新
        let prevStats = { cores: -1, clock: -1, processed: -1, remaining: -1, queueCount: -1 };

        // =========================================================
        // DOM キャッシュ（初期化時に一度だけ取得）
        // =========================================================
        const setupScreen = document.getElementById('setupScreen');
        const simScreen = document.getElementById('simScreen');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const homeBtn = document.getElementById('homeBtn');
        const algoSelect = document.getElementById('algoSelect');
        const coresContainer = document.getElementById('coresContainer');
        const queueContainer = document.getElementById('queueContainer');
        const completeMessage = document.getElementById('completeMessage');

        // 統計表示用DOMキャッシュ
        const statCoresEl = document.getElementById('statCores');
        const statClockEl = document.getElementById('statClock');
        const statProcessedEl = document.getElementById('statProcessed');
        const statRemainingEl = document.getElementById('statRemaining');
        const queueCountEl = document.getElementById('queueCount');
        const statAlgoEl = document.getElementById('statAlgo');
        const finalCountEl = document.getElementById('finalCount');

        // 【最適化6】キュー表示用のDOMプール（事前生成、再利用）
        let queueDomPool = [];
        let queueMoreEl = null;

        // =========================================================
        // イベントリスナー
        // =========================================================
        startBtn.addEventListener('click', startSimulation);
        resetBtn.addEventListener('click', resetSimulation);
        pauseBtn.addEventListener('click', togglePause);
        homeBtn.addEventListener('click', backToHome);
        algoSelect.addEventListener('change', () => {
            algorithm = algoSelect.value;
            statAlgoEl.textContent = algorithm.toUpperCase();
        });

        // =========================================================
        // キュー操作（アルゴリズム別に最適化）
        // =========================================================
        
        // タスクをキューに追加
        function enqueueTask(task) {
            if (algorithm === 'sjf') {
                sjfHeap.push(task);
            } else {
                fcfsQueue.push(task);
            }
            queueDirty = true;
        }

        // タスクをキューから取り出し
        function dequeueTask() {
            let task = null;
            if (algorithm === 'sjf') {
                task = sjfHeap.pop();
            } else {
                task = fcfsQueue.shift();
            }
            if (task) queueDirty = true;
            return task;
        }

        // キューの長さを取得
        function getQueueLength() {
            return algorithm === 'sjf' ? sjfHeap.size : fcfsQueue.length;
        }

        // =========================================================
        // 【最適化7】コアDOMの初期化（一度だけ生成し、参照を保持）
        // =========================================================
        function initCoreDom() {
            // 既存のDOM要素をクリア
            coresContainer.innerHTML = '';
            
            // DocumentFragmentで一括追加（初期化時のみ許容）
            const frag = document.createDocumentFragment();

            for (let i = 0; i < cores; i++) {
                // コア状態オブジェクト
                const coreState = {
                    id: i,
                    currentTask: null,
                    timeSpentMs: 0,
                    load: 0,
                    progress: 0,
                    // 前回の描画状態をキャッシュ
                    prevLoad: -1,
                    prevProgress: -1,
                    prevTaskId: -1,
                    // DOM参照を保持
                    dom: null
                };

                // DOM構築
                const root = document.createElement('div');
                root.className = 'core-item';

                const header = document.createElement('div');
                header.className = 'core-header';
                header.textContent = `C${i}`;
                root.appendChild(header);

                // タスク表示部（常に存在、表示/非表示を切り替え）
                const taskBox = document.createElement('div');
                taskBox.className = 'core-task';
                taskBox.style.display = 'none';

                const taskName = document.createElement('div');
                taskName.style.fontWeight = 'bold';
                taskBox.appendChild(taskName);

                const barWrap = document.createElement('div');
                barWrap.className = 'progress-bar';
                const fill = document.createElement('div');
                fill.className = 'progress-fill';
                fill.style.width = '0%';
                barWrap.appendChild(fill);
                taskBox.appendChild(barWrap);

                const info = document.createElement('div');
                info.style.fontSize = '0.72rem';
                info.style.marginTop = '6px';
                info.style.color = '#c084fc';
                taskBox.appendChild(info);

                root.appendChild(taskBox);

                // アイドル表示部（常に存在、表示/非表示を切り替え）
                const idle = document.createElement('div');
                idle.className = 'core-idle';
                idle.textContent = '待機';
                root.appendChild(idle);

                // DOM参照を保持
                coreState.dom = {
                    root: root,
                    taskBox: taskBox,
                    taskName: taskName,
                    progressFill: fill,
                    info: info,
                    idle: idle
                };

                coreStates.push(coreState);
                frag.appendChild(root);
            }

            coresContainer.appendChild(frag);
        }

        // =========================================================
        // 【最適化8】キュー表示用DOMプールの初期化
        // =========================================================
        function initQueueDomPool() {
            queueContainer.innerHTML = '';
            queueDomPool = [];
            
            const frag = document.createDocumentFragment();
            
            // MAX_QUEUE_DISPLAY個のDOM要素を事前生成
            for (let i = 0; i < MAX_QUEUE_DISPLAY; i++) {
                const div = document.createElement('div');
                div.className = 'task-item';
                div.style.display = 'none';
                queueDomPool.push(div);
                frag.appendChild(div);
            }

            // "+N more" 表示用要素
            queueMoreEl = document.createElement('div');
            queueMoreEl.style.color = '#c084fc';
            queueMoreEl.style.padding = '8px';
            queueMoreEl.style.fontSize = '0.8rem';
            queueMoreEl.style.display = 'none';
            frag.appendChild(queueMoreEl);

            queueContainer.appendChild(frag);
        }

        // =========================================================
        // シミュレーション開始
        // =========================================================
        function startSimulation() {
            // 入力値取得
            cores = Math.max(1, parseInt(document.getElementById('coresInput').value) || 16);
            clockSpeed = Math.max(1, parseInt(document.getElementById('clockInput').value) || 1000);
            totalTasks = Math.max(1, parseInt(document.getElementById('tasksInput').value) || 1000);
            algorithm = algoSelect.value || 'fcfs';
            statAlgoEl.textContent = algorithm.toUpperCase();

            // 状態初期化
            fcfsQueue = [];
            sjfHeap = new MinHeap((a, b) => {
                // SJF: duration * weight の小さい順
                return (a.duration * a.weight) - (b.duration * b.weight);
            });
            coreStates = [];
            tasksProcessed = 0;
            taskIdCounter = 0;
            isRunning = true;
            isPaused = false;
            lastTimestamp = 0;
            lastRenderTime = 0;
            queueDirty = true;
            prevStats = { cores: -1, clock: -1, processed: -1, remaining: -1, queueCount: -1 };

            // 【最適化9】タスク生成（ループ内でオブジェクト生成は避けられないが、最小限に）
            for (let i = 0; i < totalTasks; i++) {
                const task = {
                    id: taskIdCounter++,
                    duration: Math.random() * 2000 + 500,
                    size: Math.floor(Math.random() * 80) + 20,
                    weight: Math.random() * 1.5 + 0.5
                };
                if (algorithm === 'sjf') {
                    sjfHeap.push(task);
                } else {
                    fcfsQueue.push(task);
                }
            }

            // UI切り替え
            setupScreen.classList.add('hidden');
            simScreen.classList.remove('hidden');
            completeMessage.classList.add('hidden');

            // 【最適化7】コアDOMを初期化時に一度だけ生成
            initCoreDom();

            // 【最適化8】キューDOMプールを初期化
            initQueueDomPool();

            // 初回描画
            updateStats(true);
            renderQueue(true);
            renderCores(true);

            // RAF開始
            rafId = requestAnimationFrame(loop);
        }

        // =========================================================
        // リセット
        // =========================================================
        function resetSimulation() {
            isRunning = false;
            isPaused = false;
            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
            fcfsQueue = [];
            sjfHeap = null;
            coreStates = [];
            tasksProcessed = 0;
            taskIdCounter = 0;
            lastTimestamp = 0;
            setupScreen.classList.remove('hidden');
            simScreen.classList.add('hidden');
            completeMessage.classList.add('hidden');
            pauseBtn.textContent = '⏸️ 一時停止';
        }

        // =========================================================
        // ホームに戻る
        // =========================================================
        function backToHome() {
            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
            isRunning = false;
            isPaused = false;
            lastTimestamp = 0;
            setupScreen.classList.remove('hidden');
            simScreen.classList.add('hidden');
            pauseBtn.textContent = '⏸️ 一時停止';
            completeMessage.classList.add('hidden');
        }

        // =========================================================
        // 一時停止/再開
        // =========================================================
        function togglePause() {
            if (!isRunning) return;
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? '▶️ 再開' : '⏸️ 一時停止';
            if (!isPaused && rafId === null) {
                lastTimestamp = 0;
                rafId = requestAnimationFrame(loop);
                isRunning = true;
            }
        }

        // =========================================================
        // メインループ
        // =========================================================
        function loop(timestamp) {
            if (!isRunning || isPaused) { rafId = null; return; }

            if (!lastTimestamp) lastTimestamp = timestamp;
            const delta = timestamp - lastTimestamp;
            lastTimestamp = timestamp;

            // 【計算フェーズ】毎フレーム実行
            let tasksCompletedThisFrame = 0;
            const speedFactor = Math.max(0.001, clockSpeed / 1000);

            // コア状態の更新（forループで高速化）
            for (let i = 0; i < coreStates.length; i++) {
                const core = coreStates[i];
                if (core.currentTask) {
                    core.timeSpentMs += delta;
                    const effectiveDuration = core.currentTask.duration * core.currentTask.weight / speedFactor;
                    const progress = Math.min(100, (core.timeSpentMs / effectiveDuration) * 100);
                    core.progress = progress;
                    core.load = Math.min(100, 30 + progress * 0.7);

                    if (core.timeSpentMs >= effectiveDuration) {
                        tasksCompletedThisFrame++;
                        core.currentTask = null;
                        core.timeSpentMs = 0;
                        core.progress = 0;
                        core.load = 0;
                    }
                }
            }

            // 空いているコアにタスクを割り当て
            const queueLen = getQueueLength();
            if (queueLen > 0) {
                for (let i = 0; i < coreStates.length; i++) {
                    const core = coreStates[i];
                    if (!core.currentTask && getQueueLength() > 0) {
                        const t = dequeueTask();
                        if (t) {
                            core.currentTask = t;
                            core.timeSpentMs = 0;
                            core.progress = 0;
                            core.load = 30;
                        }
                    }
                }
            }

            if (tasksCompletedThisFrame > 0) {
                tasksProcessed += tasksCompletedThisFrame;
            }

            // 完了判定
            let anyBusy = false;
            for (let i = 0; i < coreStates.length; i++) {
                if (coreStates[i].currentTask) { anyBusy = true; break; }
            }
            if (getQueueLength() === 0 && !anyBusy) {
                isRunning = false;
                completeMessage.classList.remove('hidden');
                finalCountEl.textContent = tasksProcessed;
            }

            // 【描画フェーズ】スロットリング（約30fps）
            const timeSinceRender = timestamp - lastRenderTime;
            if (timeSinceRender >= RENDER_INTERVAL) {
                lastRenderTime = timestamp;
                updateStats(false);
                renderQueue(false);
                renderCores(false);
            }

            rafId = isRunning ? requestAnimationFrame(loop) : null;
        }

        // =========================================================
        // 【最適化10】統計更新（変更時のみDOM更新）
        // =========================================================
        function updateStats(force) {
            const runningCount = coreStates.reduce((acc, c) => acc + (c.currentTask ? 1 : 0), 0);
            const queueLen = getQueueLength();
            const remaining = queueLen + runningCount;

            // 変更がある場合のみDOMを更新
            if (force || prevStats.cores !== cores) {
                statCoresEl.textContent = cores;
                prevStats.cores = cores;
            }
            if (force || prevStats.clock !== clockSpeed) {
                statClockEl.textContent = clockSpeed + ' MHz';
                prevStats.clock = clockSpeed;
            }
            if (force || prevStats.processed !== tasksProcessed) {
                statProcessedEl.textContent = tasksProcessed;
                prevStats.processed = tasksProcessed;
            }
            if (force || prevStats.remaining !== remaining) {
                statRemainingEl.textContent = remaining;
                prevStats.remaining = remaining;
            }
            if (force || prevStats.queueCount !== queueLen) {
                queueCountEl.textContent = queueLen;
                prevStats.queueCount = queueLen;
            }
        }

        // =========================================================
        // 【最適化11】キュー描画（DOMプール再利用、差分更新）
        // =========================================================
        function renderQueue(force) {
            if (!force && !queueDirty) return;
            queueDirty = false;

            // キューの内容を取得（SJFの場合はヒープを配列として参照）
            const queueArray = algorithm === 'sjf' ? sjfHeap._heap : fcfsQueue;
            const displayCount = Math.min(queueArray.length, MAX_QUEUE_DISPLAY);

            // 表示する要素を更新
            for (let i = 0; i < MAX_QUEUE_DISPLAY; i++) {
                const el = queueDomPool[i];
                if (i < displayCount) {
                    const task = queueArray[i];
                    el.style.display = '';
                    el.style.minWidth = Math.max(24, task.size) + 'px';
                    el.textContent = `T${task.id}`;
                    el.title = `w:${task.weight.toFixed(2)} dur:${Math.round(task.duration)}ms`;
                } else {
                    el.style.display = 'none';
                }
            }

            // "+N more" 表示
            if (queueArray.length > MAX_QUEUE_DISPLAY) {
                queueMoreEl.style.display = '';
                queueMoreEl.textContent = `+${queueArray.length - MAX_QUEUE_DISPLAY} more`;
            } else {
                queueMoreEl.style.display = 'none';
            }
        }

        // =========================================================
        // 【最適化12】コア描画（DOM参照を使用、差分更新）
        // =========================================================
        function renderCores(force) {
            for (let i = 0; i < coreStates.length; i++) {
                const core = coreStates[i];
                const dom = core.dom;
                const taskId = core.currentTask ? core.currentTask.id : -1;

                // 負荷クラスの更新（変更時のみ）
                if (force || core.prevLoad !== core.load) {
                    const root = dom.root;
                    // classList.toggleで効率的に切り替え
                    root.classList.toggle('active-high', core.load > 70);
                    root.classList.toggle('active-mid', core.load > 40 && core.load <= 70);
                    root.classList.toggle('active-low', core.load > 0 && core.load <= 40);
                    core.prevLoad = core.load;
                }

                // タスク表示の更新
                if (force || core.prevTaskId !== taskId) {
                    if (core.currentTask) {
                        dom.taskBox.style.display = '';
                        dom.idle.style.display = 'none';
                        dom.taskName.textContent = `T${core.currentTask.id}`;
                        dom.info.textContent = `w:${core.currentTask.weight.toFixed(2)} dur:${Math.round(core.currentTask.duration)}ms`;
                    } else {
                        dom.taskBox.style.display = 'none';
                        dom.idle.style.display = '';
                    }
                    core.prevTaskId = taskId;
                }

                // プログレスバーの更新（タスク実行中のみ、変更時のみ）
                if (core.currentTask) {
                    const progressInt = Math.round(core.progress);
                    if (force || core.prevProgress !== progressInt) {
                        dom.progressFill.style.width = progressInt + '%';
                        core.prevProgress = progressInt;
                    }
                }
            }
        }

    })();
    </script>
</body>
